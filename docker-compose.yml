# ============================================================================
# Phase 12 Deployment Specification: Multi-Container Docker Compose Stack
# AI-Powered Personal Financial Portfolio Management & Decision Support System
# Services:
#   1. postgres: PostgreSQL 16 Alpine database with health checks & persistent volume
#   2. backend: FastAPI REST backend (auto-migrated, security-hardened)
#   3. frontend: Next.js 15 financial analytics dashboard
# ============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-portfolio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_secret_pass}@postgres:5432/${POSTGRES_DB:-portfolio_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-secret-key-change-in-production-min32chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-portfolio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - portfolio_net

volumes:
  postgres_data:
    name: ai_portfolio_postgres_data

networks:
  portfolio_net:
    driver: bridge
